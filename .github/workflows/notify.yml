name: Notify Jira status

on:
  schedule:
    # Start at 07:30 KST so the report is ready to post at 08:00 KST.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      jql:
        description: "Optional JQL override for manual testing"
        required: false
        default: ""
      dry_run:
        description: "Fetch and print matching issues without sending Discord"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Jira status report
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JIRA_JQL: ${{ inputs.jql || secrets.JIRA_JQL }}
          DRY_RUN: ${{ inputs.dry_run }}
          DISCORD_SEND_AT_KST: ${{ github.event_name == 'schedule' && '08:00' || '' }}
        run: python jira_status_notify.py

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity. Push an empty commit when the last
      # commit is 50 or more days old so the schedule keeps running.
      - name: Keep schedule alive
        if: always() && github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: prevent scheduled workflow from being disabled"
            git push
          fi
